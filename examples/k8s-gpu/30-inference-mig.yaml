# Inference deployment using a MIG (Multi-Instance GPU) slice.
# Requires the GPU Operator + MIG strategy configured per node.
#
# Common MIG profiles on H100:
#   1g.10gb  — 1 SM partition, 10 GB VRAM  (7 per H100)
#   2g.20gb  — 2 SM partitions, 20 GB VRAM (3 per H100)
#   3g.40gb  — 3 SM partitions, 40 GB VRAM (2 per H100)
#   7g.80gb  — Full GPU
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: text-embedding-svc
  namespace: ai-team-a
spec:
  replicas: 4
  selector:
    matchLabels: { app: text-embedding-svc }
  template:
    metadata:
      labels: { app: text-embedding-svc }
    spec:
      priorityClassName: gpu-production
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
        nvidia.com/mig.strategy: mixed
      containers:
        - name: server
          image: ghcr.io/example/text-embed:1.4
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            limits:
              nvidia.com/mig-1g.10gb: 1   # one MIG slice = 1 SM, 10 GB
              cpu: "4"
              memory: 16Gi
            requests:
              nvidia.com/mig-1g.10gb: 1
              cpu: "2"
              memory: 8Gi
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: text-embedding-svc
  namespace: ai-team-a
spec:
  selector: { app: text-embedding-svc }
  ports:
    - { port: 80, targetPort: http, protocol: TCP }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: text-embedding-svc
  namespace: ai-team-a
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: text-embedding-svc
  minReplicas: 2
  maxReplicas: 14    # 2 H100s × 7 MIG slices
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
